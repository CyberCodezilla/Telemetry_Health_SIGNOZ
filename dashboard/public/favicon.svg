<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080D0B"/>
      <stop offset="100%" stop-color="#020403"/>
    </linearGradient>

    <!-- Eye Contour & Shield Gradient -->
    <linearGradient id="eye-grad" x1="8" y1="32" x2="56" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#5CE1A5"/>
      <stop offset="100%" stop-color="#39FF14"/>
    </linearGradient>

    <!-- Shield Glow Gradient -->
    <linearGradient id="shield-grad" x1="32" y1="8" x2="32" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5CE1A5" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Core Pupil Glow -->
    <radialGradient id="pupil-glow" cx="32" cy="32" r="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#39FF14"/>
      <stop offset="50%" stop-color="#5CE1A5"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Filter Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Base with Protective Border -->
  <rect width="64" height="64" rx="16" fill="url(#bg-grad)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="url(#eye-grad)" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Protective Outer Shield Outline -->
  <path d="M 32 8 L 52 16 V 32 C 52 44 42 52 32 56 C 22 52 12 44 12 32 V 16 Z" 
        fill="url(#shield-grad)" 
        stroke="url(#eye-grad)" 
        stroke-width="1.5" 
        stroke-opacity="0.35" 
        stroke-dasharray="3 3"/>

  <!-- Observing Eye Contour -->
  <path d="M 10 32 C 20 17, 44 17, 54 32 C 44 47, 20 47, 10 32 Z" 
        fill="none" 
        stroke="url(#eye-grad)" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Radar / Continuous Observation Scanning Ring -->
  <circle cx="32" cy="32" r="11" fill="none" stroke="#5CE1A5" stroke-width="1.2" stroke-dasharray="4 2" stroke-opacity="0.8"/>

  <!-- Glowing Iris Core -->
  <circle cx="32" cy="32" r="7" fill="url(#pupil-glow)"/>

  <!-- Pupil Center & Catchlight Dot -->
  <circle cx="32" cy="32" r="3.5" fill="#060A08"/>
  <circle cx="32" cy="32" r="2" fill="#39FF14"/>
  <circle cx="33.5" cy="30.5" r="1" fill="#FFFFFF"/>
</svg>